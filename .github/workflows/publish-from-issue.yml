name: Publish Post from Issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '<!-- blog-publish:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Create post file
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issueBody = issue.body || '';
            const v2Marker = /<!-- blog-publish:v2 (\{[^\n]*\}) -->/;
            const v1Marker = '<!-- blog-publish:v1 -->';

            core.setOutput('ready', 'false');

            async function comment(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            }

            let payload;
            let body = '';
            const v2Match = issueBody.match(v2Marker);

            if (v2Match) {
              try {
                payload = JSON.parse(v2Match[1]);
              } catch {
                await comment('Invalid publish metadata. Please submit again from the writing page.');
                return;
              }
              body = issueBody.slice((v2Match.index || 0) + v2Match[0].length).replace(/\r\n/g, '\n').trim();
            } else if (issueBody.includes(v1Marker)) {
              const rawPayload = issueBody.slice(issueBody.indexOf(v1Marker) + v1Marker.length).trim();
              try {
                payload = JSON.parse(rawPayload);
              } catch {
                await comment('Invalid publish payload. Please submit again from the writing page.');
                return;
              }
              body = typeof payload.body === 'string' ? payload.body.replace(/\r\n/g, '\n').trim() : '';
            } else {
              return;
            }

            if (payload?.source !== 'write-page-v1' && payload?.source !== 'write-page-v2') {
              await comment('Unsupported publish source.');
              return;
            }

            const title = typeof payload.title === 'string' ? payload.title.trim() : '';
            const slug = typeof payload.slug === 'string' ? payload.slug.trim() : '';
            const date = typeof payload.date === 'string' ? payload.date.trim() : '';
            const lang = payload.lang === 'zh' ? 'zh' : payload.lang === 'en' ? 'en' : '';
            const rawTags = payload.tags;
            const tags = Array.isArray(rawTags)
              ? rawTags.map(tag => typeof tag === 'string' ? tag.trim() : '')
              : [];
            const tagsOk = (rawTags === undefined || Array.isArray(rawTags)) &&
              tags.length <= 8 &&
              tags.every(tag => /^[\p{L}\p{N}][\p{L}\p{N} _-]{0,31}$/u.test(tag));
            const slugOk = slug.length <= 80 && /^[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*$/u.test(slug);
            const dateMatch = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            const parsedDate = dateMatch ? new Date(`${date}T00:00:00Z`) : null;
            const dateOk = parsedDate && !Number.isNaN(parsedDate.valueOf()) && parsedDate.toISOString().slice(0, 10) === date;

            if (!title || !slugOk || !dateOk || !lang || !body || !tagsOk) {
              await comment('Invalid publish fields. Required: title, safe slug, up to 8 safe tags, real date, language, and body.');
              return;
            }

            const suffix = lang === 'zh' ? '.zh' : '';
            const filePath = `content/posts/${date}-${slug}${suffix}.dj`;
            const sitePrefix = lang === 'zh' ? '/CN' : '';
            const [year, month, day] = date.split('-');
            const postUrl = `https://gongjiyang.github.io${sitePrefix}/${year}/${month}/${day}/${encodeURIComponent(slug)}.html`;

            let existingFileSha = null;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: filePath,
                ref: 'main',
              });
              if (!Array.isArray(existing.data) && existing.data.type === 'file') {
                existingFileSha = existing.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!existingFileSha) {
              const article = body.startsWith('# ') ? `${body}\n` : `# ${title}\n\n${body}\n`;
              const metadata = tags.length ? `---\ntags: ${tags.join(', ')}\n---\n\n` : '';
              const content = metadata + article;
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: filePath,
                message: `add post from issue #${issue.number}: ${date}-${slug}`,
                content: Buffer.from(content, 'utf8').toString('base64'),
                branch: 'main',
              });
            }

            core.setOutput('ready', 'true');
            core.setOutput('file_path', filePath);
            core.setOutput('post_url', postUrl);
            core.setOutput('created', existingFileSha ? 'false' : 'true');

      - name: Check out updated main
        if: steps.create.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        if: steps.create.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Build site
        if: steps.create.outputs.ready == 'true'
        run: bun run build --blogroll

      - name: Upload Pages artifact
        if: steps.create.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out/www

      - name: Deploy site
        if: steps.create.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Complete issue
        if: steps.create.outputs.ready == 'true' && success()
        uses: actions/github-script@v7
        env:
          FILE_PATH: ${{ steps.create.outputs.file_path }}
          POST_URL: ${{ steps.create.outputs.post_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Published: [open the post](${process.env.POST_URL})\n\nSource: \`${process.env.FILE_PATH}\``,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
