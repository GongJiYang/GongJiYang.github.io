name: Publish Post from Issue

on:
  issues:
    types:
      - opened

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Create post file
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const marker = '<!-- blog-publish:v1 -->';
            const issueBody = issue.body || '';

            async function comment(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            }

            if (!issueBody.includes(marker)) {
              return;
            }

            const rawPayload = issueBody.slice(issueBody.indexOf(marker) + marker.length).trim();

            let payload;
            try {
              payload = JSON.parse(rawPayload);
            } catch {
              await comment('Invalid publish payload JSON. Please re-submit from `/write` page.');
              return;
            }

            if (payload?.source !== 'write-page-v1') {
              await comment('Unsupported publish payload source.');
              return;
            }

            const title = typeof payload.title === 'string' ? payload.title.trim() : '';
            const slug = typeof payload.slug === 'string' ? payload.slug.trim() : '';
            const date = typeof payload.date === 'string' ? payload.date.trim() : '';
            const lang = payload.lang === 'zh' ? 'zh' : payload.lang === 'en' ? 'en' : '';
            const body = typeof payload.body === 'string' ? payload.body.replace(/\r\n/g, '\n').trim() : '';

            const slugOk = /^[a-z0-9-]+$/.test(slug);
            const dateOk = /^\d{4}-\d{2}-\d{2}$/.test(date) && !Number.isNaN(Date.parse(`${date}T00:00:00Z`));

            if (!title || !slugOk || !dateOk || !lang || !body) {
              await comment('Invalid payload fields. Required: title, slug, date, lang, body.');
              return;
            }

            const suffix = lang === 'zh' ? '.zh' : '';
            const filePath = `content/posts/${date}-${slug}${suffix}.dj`;

            let existingFileSha = null;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: filePath,
                ref: 'main',
              });

              if (!Array.isArray(existing.data) && existing.data.type === 'file') {
                existingFileSha = existing.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingFileSha) {
              await comment(`Post file already exists: \`${filePath}\``);
              return;
            }

            const content = body.startsWith('# ') ? `${body}\n` : `# ${title}\n\n${body}\n`;

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: filePath,
              message: `add post from issue #${issue.number}: ${date}-${slug}`,
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch: 'main',
            });

            await comment(`Created post file: \`${filePath}\`\n\nDeployment will run via CI automatically.`);

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
            });
